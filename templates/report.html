{% extends "base.html" %}
{% block content %}
<div class="form-container">
    <h1>Report an Item</h1>
    <p class="subtitle">Add details about the lost or found item.</p>
    <form method="POST">
        <label>Item Name</label>
        <input type="text" name="item_name" placeholder="e.g. Black Wallet" required>

        <label>Category</label>
        <select name="category" required>
            <option value="">Select category</option>
            <option>Electronics</option><option>Wallet</option><option>Keys</option>
            <option>Documents</option><option>Bag</option><option>Clothing</option>
            <option>Books</option><option>Other</option>
        </select>

        <label>Description</label>
        <textarea name="description" placeholder="Describe the item..."></textarea>

        <label>Location</label>
        <input type="text" name="location" placeholder="e.g. Library" required>

        <label>Report Type</label>
        <div class="radio-group">
            <label><input type="radio" name="item_type" value="Lost" required> Lost</label>
            <label><input type="radio" name="item_type" value="Found"> Found</label>
        </div>

        <label>Contact</label>
        <input type="text" name="contact" placeholder="Phone or Email" required>

        <button class="btn primary" type="submit">Submit Report</button>
    </form>
</div>
{% endblock %}
